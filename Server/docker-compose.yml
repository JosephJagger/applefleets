services:
  renderer:
    build: .
    container_name: applefleets-renderer
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "3216"
      OUTPUT_DIR: /data/output
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
    ports:
      - "127.0.0.1:3216:3216"
    volumes:
      - ./output:/data/output
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3216/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
