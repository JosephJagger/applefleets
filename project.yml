name: AppleFleets
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
packages:
  Swifter:
    url: https://github.com/httpswift/swifter
    from: "1.5.0"
targets:
  AppleFleets:
    type: application
    platform: iOS
    sources:
      - AppleFleets
    dependencies:
      - package: Swifter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.applefleets
        INFOPLIST_FILE: AppleFleets/Info.plist
        CODE_SIGN_ENTITLEMENTS: AppleFleets/AppleFleets.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: false
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
        Release:
          CODE_SIGN_STYLE: Automatic
    entitlements:
      path: AppleFleets/AppleFleets.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true
    attributes:
      SystemCapabilities:
        com.apple.HealthKit:
          enabled: 1
