name: Build

on:
  push:
  pull_request:

jobs:
  mac-and-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate iOS project
        run: xcodegen generate
      - name: Check installer scripts
        run: zsh -n scripts/install-mac-agent.sh scripts/uninstall-mac-agent.sh
      - name: Test Linux renderer
        run: node --test Server/test/*.test.js
      - name: Build iOS app for simulator
        run: >-
          xcodebuild build
          -project AppleFleets.xcodeproj
          -scheme AppleFleets
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
      - name: Test Mac renderer
        working-directory: Mac
        run: swift test
